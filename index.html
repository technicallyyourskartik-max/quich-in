<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quich.in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f5f5f5;
    --dim: #8a8a8a;
    --line: #2a2a2a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(56px, 12vw, 120px);
    letter-spacing: 0.02em;
    margin: 0;
    line-height: 1;
  }

  .tagline {
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .rule {
    width: 48px;
    height: 1px;
    background: var(--line);
    margin: 44px 0;
  }

  .game {
    width: min(360px, 84vw);
  }

  .game-label {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 18px;
  }

  .pad {
    border: 1px solid var(--line);
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, border-color 0.15s ease;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--dim);
  }

  .pad.wait { background: var(--bg); }
  .pad.go   { background: var(--fg); color: #0a0a0a; border-color: var(--fg); font-style: normal; font-family: 'Inter'; font-weight: 500; }
  .pad.early { background: #1c0a0a; border-color: #4a1a1a; color: #c98a8a; }
  .pad.result { border-color: var(--fg); }

  .result-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 44px;
    font-style: italic;
  }

  .footnote {
    margin-top: 22px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }

  .footer {
    position: fixed;
    bottom: 20px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #4a4a4a;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <h1 class="wordmark">quich</h1>
  <div class="tagline">the quick check &mdash; launching soon</div>

  <div class="rule"></div>

  <div class="game">
    <div class="game-label">how quich are you?</div>
    <div class="pad wait" id="pad">click to start</div>
    <div class="footnote" id="footnote">tap when it turns white</div>
  </div>

  <div class="footer">quich.in</div>

<script>
  const pad = document.getElementById('pad');
  const footnote = document.getElementById('footnote');
  let state = 'idle'; // idle -> waiting -> go -> done
  let timeoutId, startTime;

  function setState(s, text) {
    state = s;
    pad.className = 'pad ' + (s === 'waiting' ? 'wait' : s === 'go' ? 'go' : s === 'early' ? 'early' : s === 'result' ? 'result' : 'wait');
    pad.innerHTML = text;
  }

  function startRound() {
    setState('waiting', 'wait for it&hellip;');
    footnote.textContent = 'tap when it turns white';
    const delay = 1200 + Math.random() * 2200;
    timeoutId = setTimeout(() => {
      startTime = performance.now();
      setState('go', 'click now');
    }, delay);
  }

  pad.addEventListener('click', () => {
    if (state === 'idle' || state === 'result' || state === 'early') {
      startRound();
      return;
    }
    if (state === 'waiting') {
      clearTimeout(timeoutId);
      setState('early', 'too soon');
      footnote.textContent = 'click to try again';
      return;
    }
    if (state === 'go') {
      const ms = Math.round(performance.now() - startTime);
      let verdict = 'not bad';
      if (ms < 200) verdict = 'inhumanly quich';
      else if (ms < 280) verdict = 'quich.';
      else if (ms < 400) verdict = 'decent';
      else verdict = 'take your time';
      setState('result', `<span class="result-num">${ms}ms</span>`);
      footnote.textContent = verdict + ' &middot; click to try again'.replace('&middot;', '·');
    }
  });
</script>
</body>
</html>
