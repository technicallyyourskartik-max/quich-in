<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quich.in</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(60deg,
      #ff0055, #ff9500, #ffee00, #33ff00, #00eaff, #7000ff, #ff00d4, #ff0055);
    background-size: 800% 800%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .bouncer {
    position: fixed;
    top: 0;
    left: 0;
    font-size: 48px;
    will-change: transform;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
  }

  #caption {
    position: fixed;
    top: 50%;
    left: 0;
    right: 0;
    text-align: center;
    transform: translateY(-50%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 64px);
    letter-spacing: 0.03em;
    color: #fff;
    text-shadow:
      0 0 10px #ff00d4,
      0 0 20px #00eaff,
      0 0 30px #ffee00;
    animation: pulse 1.4s ease-in-out infinite, hueRotate 4s linear infinite;
    z-index: 10;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { transform: translateY(-50%) scale(1); }
    50%      { transform: translateY(-50%) scale(1.06); }
  }

  @keyframes hueRotate {
    from { filter: hue-rotate(0deg); }
    to   { filter: hue-rotate(360deg); }
  }

  .sparkle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    animation: twinkle linear infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.6); }
    50%      { opacity: 1; transform: scale(1.3); }
  }
</style>
</head>
<body>

<div id="caption">🚀 Launching quich.in soon 🚀</div>

<script>
  const emojis = ['⭐','🔥','💥','✨','🎉','🌈','⚡','🍕','🎈','💎','🚀','🎊'];
  const bouncers = [];
  const N = 10;

  for (let i = 0; i < N; i++) {
    const el = document.createElement('div');
    el.className = 'bouncer';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.fontSize = (30 + Math.random() * 50) + 'px';
    document.body.appendChild(el);

    bouncers.push({
      el,
      x: Math.random() * (window.innerWidth - 60),
      y: Math.random() * (window.innerHeight - 60),
      vx: (Math.random() - 0.5) * 6 || 2,
      vy: (Math.random() - 0.5) * 6 || 2,
    });
  }

  function tick() {
    for (const b of bouncers) {
      const w = b.el.offsetWidth || 60;
      const h = b.el.offsetHeight || 60;

      b.x += b.vx;
      b.y += b.vy;

      if (b.x <= 0) { b.x = 0; b.vx = Math.abs(b.vx); }
      if (b.x + w >= window.innerWidth) { b.x = window.innerWidth - w; b.vx = -Math.abs(b.vx); }
      if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy); }
      if (b.y + h >= window.innerHeight) { b.y = window.innerHeight - h; b.vy = -Math.abs(b.vy); }

      b.el.style.transform = `translate(${b.x}px, ${b.y}px) rotate(${(b.x + b.y) % 360}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // random sparkles
  const colors = ['#ff0055','#ff9500','#ffee00','#33ff00','#00eaff','#7000ff','#ff00d4'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = 2 + Math.random() * 6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDuration = (0.6 + Math.random() * 1.8) + 's';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
