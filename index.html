<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quich.in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f5f5f5;
    --dim: #7a7a7a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(56px, 12vw, 120px);
    letter-spacing: 0.02em;
    margin: 0;
    line-height: 1;
  }

  .tagline {
    margin-top: 18px;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .cursor {
    display: inline-block;
    width: 1px;
    height: 0.9em;
    background: var(--dim);
    margin-left: 2px;
    vertical-align: -0.1em;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .footer {
    position: fixed;
    bottom: 22px;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: #3a3a3a;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <h1 class="wordmark">quich</h1>
  <div class="tagline">something's coming<span class="cursor"></span></div>

  <div class="footer">quich.in</div>

</body>
</html>
